version: '3.8'

services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app/build/outputs/apk:/workspace/app/build/outputs/apk
    command: >
      sh -c "./gradlew assembleDebug && 
             cp app/build/outputs/apk/debug/app-debug.apk /workspace/output/"
